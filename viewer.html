<!doctype html>
<html lang="en-PH"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><title>Rosabaya ML Tournament</title>
<style>
:root{--bg:#0b1020;--panel:#141d33;--p2:#1b2946;--line:#304463;--gold:#ffc857;--cyan:#56d8e8;--txt:#f5f7ff;--muted:#aab6d0;--green:#69d6a5;--red:#ff6b78}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:radial-gradient(ellipse at 85% -10%,#26385e 0,transparent 40%),var(--bg);color:var(--txt);font:15px/1.45 Inter,system-ui,Arial,sans-serif;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
.hidden{display:none!important}button,input{font:inherit}
.auth{padding:30px 22px;text-align:center}.auth-logo{width:90px;height:90px;border-radius:20px;object-fit:cover;margin:0 auto 12px;border:2px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.4);display:block}
.eyebrow{color:var(--cyan);font-size:11px;font-weight:900;letter-spacing:2.5px}h1{margin:6px 0 4px;font-size:26px;line-height:1.1}.muted{color:var(--muted)}.small{font-size:12px}
.card{background:linear-gradient(145deg,var(--panel),#111a2e);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;text-align:left}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 5px;text-align:left}
input{width:100%;background:#0c1426;border:1px solid var(--line);border-radius:9px;padding:13px;color:var(--txt);outline:none}input:focus{border-color:var(--cyan)}
.btn{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:linear-gradient(135deg,#ffe16a,#f4a900);color:#141a2a;font-weight:900;cursor:pointer}
.link{background:none;border:0;color:var(--cyan);margin-top:14px;padding:6px;cursor:pointer;width:100%}
.err{margin-top:12px;color:var(--red);font-size:13px;min-height:18px}
header{position:sticky;top:0;z-index:5;background:#0b1020ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header b{display:block;font-size:15px}header small{color:var(--muted);font-size:11px}
.ibtn{background:var(--p2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:7px 10px;font-size:12px;cursor:pointer}
main{padding:6px 14px 16px}h2{font-size:15px;color:var(--gold);margin:18px 2px 4px;letter-spacing:.5px}
.empty{padding:28px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;margin:12px 0}
.lg{width:34px;height:34px;flex:none;border-radius:9px;background:#20385d;color:var(--gold);display:grid;place-items:center;font-weight:900;font-size:12px;overflow:hidden}.lg img{width:100%;height:100%;object-fit:cover}
.m-top{display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px;color:var(--cyan);font-weight:800;margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px;padding:5px 0}.row .n{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}.row .s{font-weight:900;font-size:17px;min-width:22px;text-align:right}
.row.w .n,.row.w .s{color:var(--gold)}.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px;padding-top:7px;border-top:1px solid #ffffff12}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--cyan);font-size:10px;letter-spacing:1px;text-align:center;padding:8px 3px}td{padding:9px 3px;border-top:1px solid var(--line);text-align:center}th:nth-child(2),td:nth-child(2){text-align:left}
td .tm{display:flex;align-items:center;gap:8px;font-weight:700}.pts{color:var(--gold);font-weight:900}
.team-h{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:inherit;text-align:left;padding:0;cursor:pointer}.team-h .lg{width:46px;height:46px}.team-h strong{display:block}.team-h small{color:var(--muted)}.chev{margin-left:auto;color:var(--muted)}
.roster{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.pl{background:#0c1426;border:1px solid #293b5a;border-radius:11px;padding:10px 6px;text-align:center;cursor:pointer}
.pl .ph{width:72px;height:72px;border-radius:50%;object-fit:cover;margin:0 auto 6px;display:grid;place-items:center;background:#304466;color:var(--gold);font-weight:900;font-size:22px}.pl b{display:block;overflow-wrap:anywhere;font-size:13px}.role{display:inline-block;margin-top:4px;background:#283b5e;color:var(--cyan);border-radius:20px;padding:2px 8px;font-size:10px;font-weight:800}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(5,1fr);background:#0b1020f5;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{background:none;border:0;color:var(--muted);padding:6px 0;font-size:10px;font-weight:700;cursor:pointer}nav button span{display:block;font-size:20px;line-height:1.2}nav button.on{color:var(--gold)}
.modal{position:fixed;inset:0;background:#000d;z-index:20;display:grid;place-items:center;padding:20px;text-align:center}.modal img{max-width:100%;max-height:68vh;border-radius:14px}.modal .big{width:200px;height:200px;border-radius:50%;background:#304466;display:grid;place-items:center;font-size:70px;color:var(--gold);margin:auto}.modal h3{margin:14px 0 4px;font-size:22px}
</style></head><body>

<section id="auth" class="auth hidden">
 <img src="Gemini_Generated_Image_lzvitjlzvitjlzvi.jpg" alt="Rosabaya Logo" class="auth-logo">
 <div class="eyebrow">ROSABAYA ML TOURNAMENT</div><h1 id="aTitle">Mag-login</h1>
 <p class="muted" id="aSub">Pangalan at password lang ang kailangan para makita ang schedule, standings, results, bracket at players.</p>
 <label for="nm">Pangalan</label><input id="nm" maxlength="28" autocomplete="username">
 <label for="pw">Password (hindi bababa sa 6 na character)</label><input id="pw" type="password" autocomplete="current-password">
 <div class="err" id="err"></div>
 <button class="btn" id="go">Mag-login</button>
 <button class="link" id="sw">Wala pang account? Mag-sign up</button>
</section>

<div id="app" class="hidden">
 <header><div><b id="ev">Rosabaya ML Tournament</b><small id="hi"></small></div><div><button class="ibtn" id="rf">⟳</button> <button class="ibtn" id="lo">Logout</button></div></header>
 <main id="view"></main>
 <nav id="nav"></nav>
</div>
<div id="modal" class="modal hidden"></div>

<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AU=RB.url+'/auth/v1',KEY='rb_viewer';
let sess=null,D=null,mode='login',tab='schedule',open={};
try{sess=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const TABS=[['schedule','📅','Schedule'],['standings','🏆','Standings'],['results','✅','Results'],['bracket','🧩','Bracket'],['teams','👥','Teams']];

async function emailFor(n){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(n.trim().toLowerCase().replace(/\s+/g,' ')));return[...new Uint8Array(b)].slice(0,20).map(x=>x.toString(16).padStart(2,'0')).join('')+'@viewers.rosabaya.app'}
async function authCall(path,body){const r=await fetch(AU+path,{method:'POST',headers:{apikey:RB.key,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.msg||j.error_description||j.message||'Error '+r.status);return j}
function saveSess(j,name){sess={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,name:name||sess?.name||(j.user?.user_metadata?.name)||''};localStorage.setItem(KEY,JSON.stringify(sess))}
async function token(){if(!sess)throw Error('nologin');if(Date.now()>sess.exp-60000){const j=await authCall('/token?grant_type=refresh_token',{refresh_token:sess.refresh});saveSess(j)}return sess.access}

$('sw').onclick=()=>{mode=mode==='login'?'signup':'login';const s=mode==='signup';$('aTitle').textContent=s?'Gumawa ng account':'Mag-login';$('go').textContent=s?'Mag-sign up':'Mag-login';$('sw').textContent=s?'May account na? Mag-login':'Wala pang account? Mag-sign up';$('err').textContent=''};
$('go').onclick=async()=>{const name=$('nm').value.trim(),pw=$('pw').value;$('err').textContent='';
 if(!name){$('err').textContent='Ilagay ang pangalan.';return}if(pw.length<6){$('err').textContent='Hindi bababa sa 6 na character ang password.';return}
 $('go').disabled=true;
 try{const email=await emailFor(name);let j;
  if(mode==='signup'){j=await authCall('/signup',{email,password:pw,data:{name}});if(!j.access_token)throw Error('NOCONFIRM')}
  else j=await authCall('/token?grant_type=password',{email,password:pw});
  saveSess(j,name);start()}
 catch(e){const m=e.message;$('err').textContent=/already|registered/i.test(m)?'May gumagamit na ng pangalang iyan. Dagdagan ng apelyido o numero.':/invalid login/i.test(m)?'Mali ang pangalan o password.':m==='NOCONFIRM'?'Hindi pa naka-off ang email confirmation sa Supabase. Sabihan ang organizer.':m;}
 $('go').disabled=false};
$('lo').onclick=()=>{localStorage.removeItem(KEY);sess=null;D=null;$('app').classList.add('hidden');$('auth').classList.remove('hidden')};
$('rf').onclick=()=>load();

async function load(){$('view').innerHTML='<div class="empty">Loading...</div>';
 try{const t=await token();const r=await fetch(RB.url+'/rest/v1/published?id=eq.1&select=data,updated_at',{headers:{apikey:RB.key,Authorization:'Bearer '+t}});
  if(r.status===401){$('lo').onclick();return}const j=await r.json();D=j[0]?{...j[0].data,_at:j[0].updated_at}:null;}
 catch(e){if(e.message==='nologin'||/refresh|invalid|expired/i.test(e.message)){$('lo').onclick();return}D=null}
 render()}
function start(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('hi').textContent='Hi, '+(sess.name||'viewer');
 $('nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('');
 $('nav').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;render();scrollTo(0,0)}};load()}

const team=id=>(D.teams||[]).find(t=>t.id===id);
const logo=t=>`<span class="lg">${t&&t.logo?`<img src="${t.logo}" alt="">`:esc((t?.name||'TBD').slice(0,2).toUpperCase())}</span>`;
const nm=id=>team(id)?.name||'TBD';
const fmtD=d=>new Date(d+'T00:00:00').toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric'});
const fmtT=t=>{const[h,m]=t.split(':').map(Number);return(h%12||12)+':'+String(m).padStart(2,'0')+' '+(h<12?'AM':'PM')};
const done=m=>m.a&&m.b&&m.winner;

function matchCard(m,showScore){
 const w=m.winner;
 return `<div class="card" style="${!showScore?'':'background:#ffffff;color:#111a2e;border-color:#d0d7de'}">
  <div class="m-top" style="${!showScore?'':'color:#0969da'}"><span>${esc(m.label)}</span><span>BEST OF ${Number(m.bestOf||3)}</span></div>
  ${[['a','sa'],['b','sb']].map(([k,s])=>`<div class="row ${w&&w===m[k]?'w':''}" style="${!showScore?'':(w&&w===m[k]?'color:#1a7f37;font-weight:bold':'')}">${logo(team(m[k]))}<div class="n">${esc(nm(m[k]))}</div>${showScore?`<div class="s" style="${w&&w===m[k]?'color:#1a7f37':''}">${esc(m[s]===''?0:m[s])}</div>`:''}</div>`).join('')}
  ${m.date&&m.time&&!showScore?`<div class="foot"><span>◷ ${fmtT(m.time)}</span><span>${fmtD(m.date)}</span></div>`:''}
  ${m.date&&showScore?`<div class="foot" style="${!showScore?'':'border-top-color:#d0d7de;color:#57606a'}"><span>◷ ${m.time?fmtT(m.time):''}</span><span>${fmtD(m.date)}</span></div>`:''}
 </div>`;
}

const V={
 schedule(){const l=D.matches.filter(m=>m.date&&m.time&&!m.winner).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));if(!l.length)return'<div class="empty">Wala pang naka-schedule na upcoming matches.</div>';
  let out='',last='';l.forEach(m=>{if(m.date!==last){out+=`<h2>${esc(fmtD(m.date))}</h2>`;last=m.date}out+=matchCard(m,false)});return out},
 standings(){const ms=D.matches.filter(done);if(!D.teams.length)return'<div class="empty">Wala pang teams.</div>';
  const st=D.teams.map(t=>{const p=ms.filter(m=>m.a===t.id||m.b===t.id),w=p.filter(m=>m.winner===t.id).length;const gw=p.reduce((n,m)=>n+(Number(m.a===t.id?m.sa:m.sb)||0),0),gl=p.reduce((n,m)=>n+(Number(m.a===t.id?m.sb:m.sa)||0),0);return{t,p:p.length,w,l:p.length-w,d:gw-gl,pts:w*3}}).sort((a,b)=>b.pts-a.pts||b.w-a.w||b.d-a.d||a.t.name.localeCompare(b.t.name));
  return`<div class="card"><table><thead><tr><th>#</th><th>TEAM</th><th>P</th><th>W</th><th>L</th><th>DIFF</th><th>PTS</th></tr></thead><tbody>${st.map((x,i)=>`<tr><td>${i+1}</td><td><div class="tm">${logo(x.t)}${esc(x.t.name)}</div></td><td>${x.p}</td><td>${x.w}</td><td>${x.l}</td><td>${x.d>0?'+':''}${x.d}</td><td class="pts">${x.pts}</td></tr>`).join('')}</tbody></table></div><p class="muted small">3 puntos sa bawat panalo.</p>`},
 results(){const l=D.matches.filter(done).reverse();if(!l.length)return'<div class="empty">Wala pang natapos na match.</div>';
  let out='',last='';l.forEach(m=>{if(m.date!==last){out+=`<h2>${esc(fmtD(m.date))}</h2>`;last=m.date}out+=matchCard(m,true)});return out},
 bracket(){if(!D.matches.length)return'<div class="empty">Wala pang bracket.</div>';let out='',sec='',lab='';D.matches.forEach(m=>{if(m.section!==sec){out+=`<h2>${esc(m.section)}</h2>`;sec=m.section;lab=''}if(m.label!==lab&&D.matches.filter(x=>x.section===m.section).length>1){out+=`<div class="small muted" style="margin:10px 2px 0">${esc(m.label)}</div>`;lab=m.label}out+=`<div style="background:#ffffff;color:#111a2e;border:1px solid #d0d7de;border-radius:14px;padding:14px;margin:10px 0;text-align:left">
  <div class="m-top" style="color:#0969da"><span>${esc(m.label)}</span><span>BEST OF ${Number(m.bestOf||3)}</span></div>
  ${[['a','sa'],['b','sb']].map(([k,s])=>`<div class="row ${m.winner&&m.winner===m[k]?'w':''}" style="${m.winner&&m.winner===m[k]?'color:#1a7f37;font-weight:bold':''}">${logo(team(m[k]))}<div class="n">${esc(nm(m[k]))}</div><div class="s" style="${m.winner&&m.winner===m[k]?'color:#1a7f37':''}">${esc(m[s]===''?0:m[s])}</div></div>`).join('')}
  ${m.date?`<div class="foot" style="border-top-color:#d0d7de;color:#57606a"><span>◷ ${m.time?fmtT(m.time):''}</span><span>${fmtD(m.date)}</span></div>`:''}
 </div>`});return out},
 teams(){return D.teams.length?D.teams.map((t,i)=>`<div class="card"><button class="team-h" onclick="tg(${i})">${logo(t)}<div><strong>${esc(t.name)}</strong><small>Captain: ${esc(t.captain)} · ${t.players.length} players</small></div><span class="chev">${open[i]?'▲':'▼'}</span></button>${open[i]?`<div class="roster">${t.players.map((p,j)=>`<div class="pl" onclick="pp(${i},${j})">${p.photo?`<img class="ph" src="${p.photo}" alt="">`:`<div class="ph">${esc(p.name.slice(0,1).toUpperCase())}</div>`}<b>${esc(p.name)}</b><span class="role">${esc(p.role||'Flex')}</span></div>`).join('')}</div>`:''}</div>`).join(''):'<div class="empty">Wala pang teams.</div>'}
};
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 if(!D){$('view').innerHTML='<div class="empty">Wala pang na-publish na data. Subukan ulit mamaya.</div>';return}
 $('ev').textContent=(D.eventName||'Rosabaya ML Tournament');
 $('view').innerHTML=V[tab]()+(D._at?`<p class="muted small" style="text-align:center;margin-top:18px">Huling update: ${new Date(D._at).toLocaleString('en-PH',{dateStyle:'medium',timeStyle:'short'})}</p>`:'')}
function tg(i){open[i]=!open[i];render()}
function pp(i,j){const p=D.teams[i].players[j];$('modal').innerHTML=`${p.photo?`<div><img src="${p.photo}" alt=""><h3>${esc(p.name)}</h3><span class="role">${esc(p.role||'Flex')}</span><p class="muted small">${esc(D.teams[i].name)}</p></div>`:`<div><div class="big">${esc(p.name.slice(0,1).toUpperCase())}</div><h3>${esc(p.name)}</h3><span class="role">${esc(p.role||'Flex')}</span></div>`}`;$('modal').classList.remove('hidden')}
$('modal').onclick=()=>$('modal').classList.add('hidden');

if(sess)start();else $('auth').classList.remove('hidden');
</script></body></html>
