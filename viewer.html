<!doctype html>
<html lang="en-PH"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><title>Rosabaya ML Tournament</title>
<style>
:root{--bg:#0b1020;--panel:#141d33;--p2:#1b2946;--line:#304463;--gold:#ffc857;--cyan:#56d8e8;--txt:#f5f7ff;--muted:#aab6d0;--green:#4ade80;--red:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:radial-gradient(ellipse at 85% -10%,#26385e 0,transparent 40%),var(--bg);color:var(--txt);font:15px/1.45 Inter,system-ui,Arial,sans-serif;max-width:960px;margin:0 auto;min-height:100vh;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
.hidden{display:none!important}button,input{font:inherit}
.auth{padding:40px 22px;text-align:center;max-width:440px;margin:0 auto}
.auth-logo{width:110px;height:110px;border-radius:50%;object-fit:cover;margin:0 auto 14px;border:3px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.5);display:block}
.eyebrow{color:var(--cyan);font-size:11px;font-weight:900;letter-spacing:2.5px}h1{margin:6px 0 4px;font-size:26px;line-height:1.1}.muted{color:var(--muted)}.small{font-size:12px}
.card{background:linear-gradient(145deg,var(--panel),#111a2e);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0;text-align:left}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 5px;text-align:left}
input{width:100%;background:#0c1426;border:1px solid var(--line);border-radius:9px;padding:13px;color:var(--txt);outline:none}input:focus{border-color:var(--cyan)}
.btn{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:linear-gradient(135deg,#ffe16a,#f4a900);color:#141a2a;font-weight:900;cursor:pointer}
.link{background:none;border:0;color:var(--cyan);margin-top:14px;padding:6px;cursor:pointer;width:100%}
.err{margin-top:12px;color:var(--red);font-size:13px;min-height:18px}
header{position:sticky;top:0;z-index:5;background:#0b1020ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header b{display:block;font-size:16px}header small{color:var(--muted);font-size:12px}
.ibtn{background:var(--p2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:7px 12px;font-size:12px;cursor:pointer;transition:.15s}.ibtn:hover{border-color:var(--cyan)}
main{padding:10px 18px 24px}h2{font-size:14px;color:var(--gold);margin:20px 2px 10px;letter-spacing:1px;text-transform:uppercase}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}
.sec-head b{color:var(--gold);font-size:14px;letter-spacing:1px}.sec-head span{color:#6ea8fe;font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.empty{padding:36px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;margin:12px 0}

/* UPCOMING GOLD CARD DESIGN */
.up-card{background:linear-gradient(90deg,#d99a1e 0%,#f7cb52 50%,#d99a1e 100%);border:2px solid #ffe699;border-radius:14px;padding:12px 18px;color:#1b1608;box-shadow:0 6px 18px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px}
.up-top{display:flex;justify-content:space-between;align-items:center}
.up-sec{font-size:11px;font-weight:900;letter-spacing:.8px;color:#3d2b05;text-transform:uppercase}
.up-bo{background:#162238;color:#fff;font-size:10px;font-weight:800;padding:4px 10px;border-radius:6px;letter-spacing:.8px}
.up-mid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:4px 0}
.up-tm{display:flex;align-items:center;gap:10px;min-width:0}
.up-tm.right{justify-content:flex-end;text-align:right}
.up-lg{width:46px;height:46px;flex:none;border-radius:50%;background:#162238;color:#ffc857;display:grid;place-items:center;font-weight:900;font-size:15px;overflow:hidden;border:2px solid #2c3e5e;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.up-lg img{width:100%;height:100%;object-fit:cover}
.up-name{font-weight:900;font-size:16px;color:#1b1608;text-transform:uppercase;overflow-wrap:anywhere;line-height:1.15}
.up-vs{text-align:center;padding:0 6px}
.up-vs small{display:block;font-size:9px;font-weight:900;color:#3d2b05;letter-spacing:.8px}
.up-vs strong{display:block;font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.45);line-height:1.1}
.up-vs span{display:block;font-size:12px;color:#3d2b05}
.up-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(61,43,5,.2);padding-top:7px;font-size:12px;font-weight:800;color:#3d2b05}

/* MATCH RESULT CARD DESIGN */
.res-card{background:linear-gradient(135deg,#0d192b 0%,#101c30 55%,#2b141a 100%);border:1px solid #293d5e;border-radius:16px;padding:16px 18px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.res-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.res-sec{font-size:12px;font-weight:800;color:#cbd5e1;letter-spacing:.5px}
.res-badge{font-size:12px;font-weight:900;color:var(--gold);letter-spacing:1px}
.res-body{display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:center}
.res-winbox{text-align:center}
.res-photo{width:120px;height:120px;margin:0 auto 8px;border-radius:12px;background:#192c47;border:1px solid #355078;display:grid;place-items:center;font-size:44px;font-weight:900;color:#fff;overflow:hidden}
.res-photo img{width:100%;height:100%;object-fit:cover}
.res-wlbl{font-size:10px;font-weight:900;color:var(--gold);letter-spacing:1px;text-transform:uppercase}
.res-wname{font-size:15px;font-weight:800;color:#fff;margin-top:2px;overflow-wrap:anywhere}
.res-scores{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.res-col{text-align:center}
.res-tmhdr{display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 10px;border-radius:8px;font-weight:800;font-size:13px;color:#fff;margin-bottom:8px;min-height:36px}
.res-tmhdr.blue{background:#1868db}
.res-tmhdr.red{background:#dc3545}
.res-tmhdr .mini-lg{width:20px;height:20px;border-radius:5px;background:rgba(0,0,0,.25);display:grid;place-items:center;font-size:10px;font-weight:900;overflow:hidden;flex:none}
.res-tmhdr .mini-lg img{width:100%;height:100%;object-fit:cover}
.res-num{background:#ffffff;color:#0b1020;font-size:42px;font-weight:900;border-radius:12px;padding:12px 6px;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.res-stat{font-size:11px;font-weight:900;letter-spacing:1px;margin-top:7px;text-transform:uppercase}
.res-stat.win{color:var(--green)}
.res-stat.loss{color:var(--red)}
.res-vs{font-size:14px;font-weight:900;color:#cbd5e1;font-style:italic}
.res-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:10px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;font-weight:800;color:#94a3b8}

/* WHITE BRACKET CARD */
.brk-card{background:#ffffff;color:#111a2e;border:1px solid #d0d7de;border-radius:14px;padding:14px;text-align:left}
.brk-top{display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px;color:#0969da;font-weight:800;margin-bottom:8px}
.brk-row{display:flex;align-items:center;gap:10px;padding:5px 0}.brk-row .n{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}.brk-row .s{font-weight:900;font-size:17px;min-width:22px;text-align:right}
.brk-row.w .n,.brk-row.w .s{color:#1a7f37}
.brk-foot{display:flex;justify-content:space-between;color:#57606a;font-size:12px;margin-top:6px;padding-top:7px;border-top:1px solid #d0d7de}

.lg{width:34px;height:34px;flex:none;border-radius:9px;background:#20385d;color:var(--gold);display:grid;place-items:center;font-weight:900;font-size:12px;overflow:hidden}.lg img{width:100%;height:100%;object-fit:cover}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--cyan);font-size:11px;letter-spacing:1px;text-align:center;padding:10px 6px}td{padding:11px 6px;border-top:1px solid var(--line);text-align:center}th:nth-child(2),td:nth-child(2){text-align:left}
td .tm{display:flex;align-items:center;gap:10px;font-weight:700}.pts{color:var(--gold);font-weight:900}
.team-h{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:inherit;text-align:left;padding:0;cursor:pointer}.team-h .lg{width:46px;height:46px}.team-h strong{display:block;font-size:15px}.team-h small{color:var(--muted)}.chev{margin-left:auto;color:var(--muted)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:14px}.pl{background:#0c1426;border:1px solid #293b5a;border-radius:11px;padding:12px 8px;text-align:center;cursor:pointer;transition:.15s}.pl:hover{border-color:var(--cyan)}
.pl .ph{width:72px;height:72px;border-radius:50%;object-fit:cover;margin:0 auto 6px;display:grid;place-items:center;background:#304466;color:var(--gold);font-weight:900;font-size:22px}.pl b{display:block;overflow-wrap:anywhere;font-size:13px}.role{display:inline-block;margin-top:4px;background:#283b5e;color:var(--cyan);border-radius:20px;padding:2px 8px;font-size:10px;font-weight:800}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:960px;display:grid;grid-template-columns:repeat(5,1fr);background:#0b1020f5;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{background:none;border:0;color:var(--muted);padding:6px 0;font-size:11px;font-weight:700;cursor:pointer;transition:.15s}nav button span{display:block;font-size:20px;line-height:1.2}nav button.on{color:var(--gold)}nav button:hover{color:var(--txt)}
.modal{position:fixed;inset:0;background:#000d;z-index:20;display:grid;place-items:center;padding:20px;text-align:center}.modal img{max-width:100%;max-height:68vh;border-radius:14px}.modal .big{width:200px;height:200px;border-radius:50%;background:#304466;display:grid;place-items:center;font-size:70px;color:var(--gold);margin:auto}.modal h3{margin:14px 0 4px;font-size:22px}

@media(max-width:560px){
 .res-body{grid-template-columns:1fr;gap:14px}
 .res-photo{width:96px;height:96px;font-size:36px}
 .res-num{font-size:32px;padding:10px 4px}
 .up-name{font-size:14px}
 .up-lg{width:38px;height:38px;font-size:13px}
}
@media(min-width:720px){
 body{padding-bottom:24px}
 .auth{margin-top:40px;background:linear-gradient(145deg,var(--panel),#111a2e);border:1px solid var(--line);border-radius:18px;padding:36px 32px}
 .brk-grid{grid-template-columns:repeat(2,1fr)}
 nav{position:sticky;top:57px;bottom:auto;left:auto;transform:none;border-top:0;border-bottom:1px solid var(--line);padding:0 18px;display:flex;gap:8px;background:#0b1020ee;backdrop-filter:blur(10px)}
 nav button{display:flex;align-items:center;gap:6px;padding:12px 16px;font-size:13px;border-bottom:2px solid transparent}
 nav button span{font-size:16px}
 nav button.on{border-bottom-color:var(--gold)}
}
</style></head><body>

<section id="auth" class="auth hidden">
 <img src="Gemini_Generated_Image_lzvitjlzvitjlzvi.jpg" alt="Rosabaya Logo" class="auth-logo">
 <div class="eyebrow">ROSABAYA ML TOURNAMENT</div><h1 id="aTitle">Mag-login</h1>
 <p class="muted" id="aSub">Pangalan at password lang ang kailangan para makita ang schedule, standings, results, bracket at players.</p>
 <label for="nm">Pangalan</label><input id="nm" maxlength="28" autocomplete="username">
 <label for="pw">Password (hindi bababa sa 6 na character)</label><input id="pw" type="password" autocomplete="current-password">
 <div class="err" id="err"></div>
 <button class="btn" id="go">Mag-login</button>
 <button class="link" id="sw">Wala pang account? Mag-sign up</button>
</section>

<div id="app" class="hidden">
 <header><div><b id="ev">Rosabaya ML Tournament</b><small id="hi"></small></div><div><button class="ibtn" id="rf">⟳ Refresh</button> <button class="ibtn" id="lo">Logout</button></div></header>
 <nav id="nav"></nav>
 <main id="view"></main>
</div>
<div id="modal" class="modal hidden"></div>

<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AU=RB.url+'/auth/v1',KEY='rb_viewer';
let sess=null,D=null,mode='login',tab='schedule',open={};
try{sess=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const TABS=[['schedule','📅','Schedule'],['standings','🏆','Standings'],['results','✅','Results'],['bracket','🧩','Bracket'],['teams','👥','Teams']];

async function emailFor(n){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(n.trim().toLowerCase().replace(/\s+/g,' ')));return[...new Uint8Array(b)].slice(0,20).map(x=>x.toString(16).padStart(2,'0')).join('')+'@viewers.rosabaya.app'}
async function authCall(path,body){const r=await fetch(AU+path,{method:'POST',headers:{apikey:RB.key,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.msg||j.error_description||j.message||'Error '+r.status);return j}
function saveSess(j,name){sess={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,name:name||sess?.name||(j.user?.user_metadata?.name)||''};localStorage.setItem(KEY,JSON.stringify(sess))}
async function token(){if(!sess)throw Error('nologin');if(Date.now()>sess.exp-60000){const j=await authCall('/token?grant_type=refresh_token',{refresh_token:sess.refresh});saveSess(j)}return sess.access}

$('sw').onclick=()=>{mode=mode==='login'?'signup':'login';const s=mode==='signup';$('aTitle').textContent=s?'Gumawa ng account':'Mag-login';$('go').textContent=s?'Mag-sign up':'Mag-login';$('sw').textContent=s?'May account na? Mag-login':'Wala pang account? Mag-sign up';$('err').textContent=''};
$('go').onclick=async()=>{const name=$('nm').value.trim(),pw=$('pw').value;$('err').textContent='';
 if(!name){$('err').textContent='Ilagay ang pangalan.';return}if(pw.length<6){$('err').textContent='Hindi bababa sa 6 na character ang password.';return}
 $('go').disabled=true;
 try{const email=await emailFor(name);let j;
  if(mode==='signup'){j=await authCall('/signup',{email,password:pw,data:{name}});if(!j.access_token)throw Error('NOCONFIRM')}
  else j=await authCall('/token?grant_type=password',{email,password:pw});
  saveSess(j,name);start()}
 catch(e){const m=e.message;$('err').textContent=/already|registered/i.test(m)?'May gumagamit na ng pangalang iyan. Dagdagan ng apelyido o numero.':/invalid login/i.test(m)?'Mali ang pangalan o password.':m==='NOCONFIRM'?'Hindi pa naka-off ang email confirmation sa Supabase. Sabihan ang organizer.':m;}
 $('go').disabled=false};
$('lo').onclick=()=>{localStorage.removeItem(KEY);sess=null;D=null;$('app').classList.add('hidden');$('auth').classList.remove('hidden')};
$('rf').onclick=()=>load();

async function load(){$('view').innerHTML='<div class="empty">Loading...</div>';
 try{const t=await token();const r=await fetch(RB.url+'/rest/v1/published?id=eq.1&select=data,updated_at',{headers:{apikey:RB.key,Authorization:'Bearer '+t}});
  if(r.status===401){$('lo').onclick();return}const j=await r.json();D=j[0]?{...j[0].data,_at:j[0].updated_at}:null;}
 catch(e){if(e.message==='nologin'||/refresh|invalid|expired/i.test(e.message)){$('lo').onclick();return}D=null}
 render()}
function start(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('hi').textContent='Hi, '+(sess.name||'viewer');
 $('nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('');
 $('nav').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;render();scrollTo(0,0)}};load()}

const team=id=>(D.teams||[]).find(t=>t.id===id);
const logo=t=>`<span class="lg">${t&&t.logo?`<img src="${t.logo}" alt="">`:esc((t?.name||'TBD').slice(0,2).toUpperCase())}</span>`;
const upLogo=t=>`<span class="up-lg">${t&&t.logo?`<img src="${t.logo}" alt="">`:esc((t?.name||'TBD').slice(0,2).toUpperCase())}</span>`;
const miniLogo=t=>`<span class="mini-lg">${t&&t.logo?`<img src="${t.logo}" alt="">`:esc((t?.name||'TBD').slice(0,2).toUpperCase())}</span>`;
const nm=id=>team(id)?.name||'TBD';
const fmtD=d=>new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const done=m=>m.a&&m.b&&m.winner;

/* GOLD UPCOMING CARD */
function upcomingCard(m){
 const ta=team(m.a),tb=team(m.b);
 const headerTxt=[m.section,m.round].filter(Boolean).join(' · ')||m.section||'TOURNAMENT MATCH';
 return `<div class="up-card">
  <div class="up-top"><span class="up-sec">${esc(headerTxt)}</span><span class="up-bo">BEST OF ${Number(m.bestOf||3)}</span></div>
  <div class="up-mid">
   <div class="up-tm">${upLogo(ta)}<span class="up-name">${esc(nm(m.a))}</span></div>
   <div class="up-vs"><small>${esc(m.label||'MATCH')}</small><strong>VS</strong><span>⚡</span></div>
   <div class="up-tm right"><span class="up-name">${esc(nm(m.b))}</span>${upLogo(tb)}</div>
  </div>
  <div class="up-foot"><span>◷ ${esc(m.time||'TBA')}</span><span>${esc(m.date||'TBA')}</span></div>
 </div>`;
}

/* FINAL SCORE RESULT CARD */
function resultCard(m){
 const ta=team(m.a),tb=team(m.b),wt=team(m.winner);
 const headerTxt=[m.section,m.round].filter(Boolean).join(' · ')||m.section||'MATCH RESULT';
 const winPic=m.photo||m.groupPhoto||wt?.groupPhoto||wt?.logo;
 const aWin=m.winner===m.a,bWin=m.winner===m.b;
 return `<div class="res-card">
  <div class="res-top"><span class="res-sec">${esc(headerTxt)}</span><span class="res-badge">FINAL SCORE</span></div>
  <div class="res-body">
   <div class="res-winbox">
    <div class="res-photo">${winPic?`<img src="${winPic}" alt="">`:esc((wt?.name||'W').slice(0,1).toUpperCase())}</div>
    <div class="res-wlbl">WINNING TEAM</div>
    <div class="res-wname">${esc(nm(m.winner))}</div>
   </div>
   <div class="res-scores">
    <div class="res-col">
     <div class="res-tmhdr blue">${miniLogo(ta)}<span>${esc(nm(m.a))}</span></div>
     <div class="res-num">${esc(m.sa===''?0:m.sa)}</div>
     <div class="res-stat ${aWin?'win':'loss'}">${aWin?'WINNER':'DEFEATED'}</div>
    </div>
    <div class="res-vs">VS</div>
    <div class="res-col">
     <div class="res-tmhdr red">${miniLogo(tb)}<span>${esc(nm(m.b))}</span></div>
     <div class="res-num">${esc(m.sb===''?0:m.sb)}</div>
     <div class="res-stat ${bWin?'win':'loss'}">${bWin?'WINNER':'DEFEATED'}</div>
    </div>
   </div>
  </div>
  <div class="res-foot"><span>${esc(m.label||'MATCH')}</span><span>BEST OF ${Number(m.bestOf||3)}</span><span>📅 ${m.date?esc(fmtD(m.date)):'TBA'}</span></div>
 </div>`;
}

/* WHITE BRACKET CARD */
function bracketCard(m){
 const w=m.winner,showScore=!!(m.a&&m.b&&(m.sa!==''||m.sb!==''||w));
 return `<div class="brk-card">
  <div class="brk-top"><span>${esc(m.label)}</span><span>BEST OF ${Number(m.bestOf||3)}</span></div>
  ${[['a','sa'],['b','sb']].map(([k,s])=>`<div class="brk-row ${w&&w===m[k]?'w':''}">${logo(team(m[k]))}<div class="n">${esc(nm(m[k]))}</div>${showScore?`<div class="s">${esc(m[s]===''?0:m[s])}</div>`:''}</div>`).join('')}
  ${m.date||m.time?`<div class="brk-foot"><span>◷ ${esc(m.time||'')}</span><span>${esc(m.date||'')}</span></div>`:''}
 </div>`;
}

const V={
 schedule(){
  const l=(D.matches||[]).filter(m=>!m.winner&&(m.date||m.time||(m.a&&m.b))).sort((a,b)=>((a.date||'9999')+(a.time||'99:99')).localeCompare((b.date||'9999')+(b.time||'99:99')));
  if(!l.length)return'<div class="empty">Wala pang naka-schedule na upcoming matches.</div>';
  return `<div class="sec-head"><b>UPCOMING</b><span>${esc(D.eventName||'Rosabaya ML Tournament')}</span></div><div class="grid">${l.map(upcomingCard).join('')}</div>`;
 },
 standings(){
  const ms=(D.matches||[]).filter(done);if(!(D.teams||[]).length)return'<div class="empty">Wala pang teams.</div>';
  const st=D.teams.map(t=>{const p=ms.filter(m=>m.a===t.id||m.b===t.id),w=p.filter(m=>m.winner===t.id).length;const gw=p.reduce((n,m)=>n+(Number(m.a===t.id?m.sa:m.sb)||0),0),gl=p.reduce((n,m)=>n+(Number(m.a===t.id?m.sb:m.sa)||0),0);return{t,p:p.length,w,l:p.length-w,d:gw-gl,pts:w*3}}).sort((a,b)=>b.pts-a.pts||b.w-a.w||b.d-a.d||a.t.name.localeCompare(b.t.name));
  return`<div class="card" style="margin-top:14px"><table><thead><tr><th>#</th><th>TEAM</th><th>P</th><th>W</th><th>L</th><th>DIFF</th><th>PTS</th></tr></thead><tbody>${st.map((x,i)=>`<tr><td>${i+1}</td><td><div class="tm">${logo(x.t)}${esc(x.t.name)}</div></td><td>${x.p}</td><td>${x.w}</td><td>${x.l}</td><td>${x.d>0?'+':''}${x.d}</td><td class="pts">${x.pts}</td></tr>`).join('')}</tbody></table></div><p class="muted small" style="margin-top:10px">3 puntos sa bawat panalo.</p>`;
 },
 results(){
  const l=(D.matches||[]).filter(done).reverse();
  if(!l.length)return'<div class="empty">Wala pang natapos na match.</div>';
  return `<div class="sec-head"><b>MATCH RESULTS</b><span>${esc(D.eventName||'Rosabaya ML Tournament')}</span></div><div class="grid">${l.map(resultCard).join('')}</div>`;
 },
 bracket(){
  if(!(D.matches||[]).length)return'<div class="empty">Wala pang bracket.</div>';
  let out='',sec='';
  D.matches.forEach(m=>{
   if(m.section!==sec){if(sec)out+='</div>';out+=`<h2>${esc(m.section)}</h2><div class="grid brk-grid">`;sec=m.section}
   out+=bracketCard(m);
  });
  return out+'</div>';
 },
 teams(){
  return (D.teams||[]).length?`<div class="grid brk-grid" style="margin-top:14px">`+D.teams.map((t,i)=>`<div class="card"><button class="team-h" onclick="tg(${i})">${logo(t)}<div><strong>${esc(t.name)}</strong><small>Captain: ${esc(t.captain)} · ${t.players.length} players</small></div><span class="chev">${open[i]?'▲':'▼'}</span></button>${open[i]?`<div class="roster">${t.players.map((p,j)=>`<div class="pl" onclick="pp(${i},${j})">${p.photo?`<img class="ph" src="${p.photo}" alt="">`:`<div class="ph">${esc(p.name.slice(0,1).toUpperCase())}</div>`}<b>${esc(p.name)}</b><span class="role">${esc(p.role||'Flex')}</span></div>`).join('')}</div>`:''}</div>`).join('')+`</div>`:'<div class="empty">Wala pang teams.</div>';
 }
};
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 if(!D){$('view').innerHTML='<div class="empty">Wala pang na-publish na data. Subukan ulit mamaya.</div>';return}
 $('ev').textContent=(D.eventName||'Rosabaya ML Tournament');
 $('view').innerHTML=V[tab]()+(D._at?`<p class="muted small" style="text-align:center;margin-top:22px">Huling update: ${new Date(D._at).toLocaleString('en-PH',{dateStyle:'medium',timeStyle:'short'})}</p>`:'')}
function tg(i){open[i]=!open[i];render()}
function pp(i,j){const p=D.teams[i].players[j];$('modal').innerHTML=`${p.photo?`<div><img src="${p.photo}" alt=""><h3>${esc(p.name)}</h3><span class="role">${esc(p.role||'Flex')}</span><p class="muted small">${esc(D.teams[i].name)}</p></div>`:`<div><div class="big">${esc(p.name.slice(0,1).toUpperCase())}</div><h3>${esc(p.name)}</h3><span class="role">${esc(p.role||'Flex')}</span></div>`}`;$('modal').classList.remove('hidden')}
$('modal').onclick=()=>$('modal').classList.add('hidden');

if(sess)start();else $('auth').classList.remove('hidden');
</script></body></html>
