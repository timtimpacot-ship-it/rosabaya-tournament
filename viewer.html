<!doctype html>
<html lang="en-PH"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><title>Rosabaya ML Tournament</title>
<style>
:root{--bg:#0b1020;--panel:#141d33;--p2:#1b2946;--line:#304463;--gold:#ffc857;--cyan:#56d8e8;--txt:#f5f7ff;--muted:#aab6d0;--green:#4ade80;--red:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:radial-gradient(ellipse at 85% -10%,#26385e 0,transparent 40%),var(--bg);color:var(--txt);font:15px/1.45 Inter,system-ui,Arial,sans-serif;max-width:960px;margin:0 auto;min-height:100vh;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
.hidden{display:none!important}button,input{font:inherit}
.auth{padding:40px 22px;text-align:center;max-width:440px;margin:0 auto}
.auth-logo{width:110px;height:110px;border-radius:50%;object-fit:cover;margin:0 auto 14px;border:3px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.5);display:block}
.eyebrow{color:var(--cyan);font-size:11px;font-weight:900;letter-spacing:2.5px}h1{margin:6px 0 4px;font-size:26px;line-height:1.1}.muted{color:var(--muted)}.small{font-size:12px}
.card{background:linear-gradient(145deg,var(--panel),#111a2e);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0;text-align:left}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 5px;text-align:left}
input{width:100%;background:#0c1426;border:1px solid var(--line);border-radius:9px;padding:13px;color:var(--txt);outline:none}input:focus{border-color:var(--cyan)}
.btn{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:linear-gradient(135deg,#ffe16a,#f4a900);color:#141a2a;font-weight:900;cursor:pointer}
.link{background:none;border:0;color:var(--cyan);margin-top:14px;padding:6px;cursor:pointer;width:100%}
.err{margin-top:12px;color:var(--red);font-size:13px;min-height:18px}
header{position:sticky;top:0;z-index:5;background:#0b1020ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header b{display:block;font-size:16px}header small{color:var(--muted);font-size:12px}
.ibtn{background:var(--p2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:7px 12px;font-size:12px;cursor:pointer;transition:.15s}.ibtn:hover{border-color:var(--cyan)}
main{padding:10px 18px 24px}h2{font-size:14px;color:var(--gold);margin:20px 2px 10px;letter-spacing:1px;text-transform:uppercase}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}
.sec-head b{color:var(--gold);font-size:14px;letter-spacing:1px}.sec-head span{color:#6ea8fe;font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.empty{padding:36px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;margin:12px 0}

/* UPCOMING GOLD CARD DESIGN (Matching Screenshot 1) */
.up-card{background:linear-gradient(90deg,#d99a1e 0%,#f7cb52 50%,#d99a1e 100%);border:2px solid #ffe699;border-radius:14px;padding:12px 18px;color:#1b1608;box-shadow:0 6px 18px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px}
.up-top{display:flex;justify-content:space-between;align-items:center}
.up-sec{font-size:11px;font-weight:900;letter-spacing:.8px;color:#3d2b05;text-transform:uppercase}
.up-bo{background:#162238;color:#fff;font-size:10px;font-weight:800;padding:4px 10px;border-radius:6px;letter-spacing:.8px}
.up-mid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:4px 0}
.up-tm{display:flex;align-items:center;gap:10px;min-width:0}
.up-tm.right{justify-content:flex-end;text-align:right}
.up-lg{width:46px;height:46px;flex:none;border-radius:50%;background:#162238;color:#ffc857;display:grid;place-items:center;font-weight:900;font-size:15px;overflow:hidden;border:2px solid #2c3e5e;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.up-lg img{width:100%;height:100%;object-fit:cover}
.up-name{font-weight:900;font-size:16px;color:#1b1608;text-transform:uppercase;overflow-wrap:anywhere;line-height:1.15}
.up-vs{text-align:center;padding:0 6px}
.up-vs small{display:block;font-size:9px;font-weight:900;color:#3d2b05;letter-spacing:.8px}
.up-vs strong{display:block;font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.45);line-height:1.1}
.up-vs span{display:block;font-size:12px;color:#3d2b05}
.up-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(61,43,5,.2);padding-top:7px;font-size:12px;font-weight:800;color:#3d2b05}

/* MATCH RESULT CARD DESIGN (Matching Screenshot 2) */
.res-card{background:linear-gradient(135deg,#0d192b 0%,#101c30 55%,#2b141a 100%);border:1px solid #293d5e;border-radius:16px;padding:16px 18px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.res-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.res-sec{font-size:12px;font-weight:800;color:#cbd5e1;letter-spacing:.5px}
.res-badge{font-size:12px;font-weight:900;color:var(--gold);letter-spacing:1px}
.res-body{display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:center}
.res-winbox{text-align:center}
.res-photo{width:120px;height:120px;margin:0 auto 8px;border-radius:12px;background:#192c47;border:1px solid #355078;display:grid;place-items:center;font-size:44px;font-weight:900;color:#fff;overflow:hidden}
.res-photo img{width:100%;height:100%;object-fit:cover}
.res-wlbl{font-size:10px;font-weight:900;color:var(--gold);letter-spacing:1px;text-transform:uppercase}
.res-wname{font-size:15px;font-weight:800;color:#fff;margin-top:2px;overflow-wrap:anywhere}
.res-scores{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.res-col{text-align:center}
